AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudFormation template for CodePipeline
  manual approval lab.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:

  LabBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

Outputs:

  BucketName:
    Description: Name of the S3 bucket
    Value: !Ref LabBucket
